{% raw %}
<style>
@page { size: A4; margin: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; color: #1a1a2e; line-height: 1.45; font-size: 10.5pt; }
.page { width: 210mm; min-height: 297mm; padding: 18mm 20mm; box-sizing: border-box; position: relative; page-break-after: always; }
.page:last-child { page-break-after: auto; }

/* Header */
.doc-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10mm; border-bottom: 1.5px solid #1e3a5f; padding-bottom: 6mm; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo-svg { height: 32px; width: auto; }
.brand-name { font-size: 16pt; font-weight: 800; color: #1e3a5f; letter-spacing: 1px; }
.brand-text small { font-size: 8pt; color: #6b7b8e; text-transform: uppercase; letter-spacing: 1px; }
.doc-meta { text-align: right; }
.doc-title { font-size: 13pt; font-weight: 700; color: #1e3a5f; }
.doc-num { font-size: 9pt; color: #6b7b8e; margin-top: 2px; }

/* Parties */
.parties { display: flex; gap: 16mm; margin-bottom: 8mm; }
.party { flex: 1; background: #f4f7fb; padding: 8px 12px; border-radius: 6px; }
.party h4 { font-size: 8pt; text-transform: uppercase; color: #6b7b8e; margin-bottom: 4px; letter-spacing: .5px; }
.p-name { font-size: 11pt; font-weight: 700; color: #1e3a5f; }
.p-row { font-size: 9.5pt; color: #444; }

/* Product hero */
.product { text-align: center; margin: 8mm 0 10mm; }
.product h1 { font-size: 22pt; font-weight: 800; color: #1e3a5f; margin-bottom: 4px; }
.product .sub { font-size: 10pt; color: #6b7b8e; margin-bottom: 8mm; }
.hero { background: linear-gradient(135deg,#1e3a5f 0%,#3d6a9e 100%); color: #fff; padding: 40px; border-radius: 12px; font-size: 24pt; font-weight: 800; }
.hero-img { height: 140px; display: flex; align-items: center; justify-content: center; }

/* Sections */
.sec { font-size: 13pt; font-weight: 700; color: #1e3a5f; margin: 8mm 0 5mm; display: flex; align-items: center; gap: 8px; }
.sec .n { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; background: #1e3a5f; color: #fff; font-size: 10pt; border-radius: 50%; }

/* Why grid */
.why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.why-card { background: #f4f7fb; padding: 10px 12px; border-radius: 8px; }
.why-num { font-size: 16pt; font-weight: 800; color: #1e3a5f; opacity: .25; }
.why-card h3 { font-size: 10pt; font-weight: 700; color: #1e3a5f; margin: 2px 0 4px; }
.why-card p { font-size: 9pt; color: #555; }
.why-prem { grid-column: span 2; background: #1e3a5f; color: #fff; }
.why-prem .why-num { color: #fff; opacity: .4; }
.why-prem h3 { color: #fff; }
.why-prem p { color: #dbe4ee; }
.prem-mini { font-size: 8.5pt; margin-top: 3px; color: #dbe4ee; }

/* Specs table */
.spec-table { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin: 4mm 0; }
.spec-table th { text-align: left; background: #1e3a5f; color: #fff; padding: 6px 10px; font-weight: 600; }
.spec-table td { padding: 5px 10px; border-bottom: 1px solid #dbe4ee; }
.spec-table tr:nth-child(even) { background: #f4f7fb; }

/* Functions */
.func-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.func-item { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; background: #f4f7fb; border-radius: 6px; }
.func-icon { width: 22px; height: 22px; background: #1e3a5f; color: #fff; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 9pt; flex-shrink: 0; }
.func-item h4 { font-size: 9.5pt; font-weight: 700; color: #1e3a5f; margin-bottom: 2px; }
.func-item p { font-size: 8.5pt; color: #555; }

/* Cost table */
.cost-table { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin: 4mm 0; }
.cost-table .group td { background: #1e3a5f; color: #fff; padding: 5px 10px; font-weight: 600; font-size: 9pt; }
.cost-table td { padding: 5px 10px; border-bottom: 1px solid #dbe4ee; }
.cost-table .on { text-align: center; color: #2e8b57; font-weight: 700; width: 40px; }
.cost-table .r { text-align: right; font-weight: 600; width: 120px; }
.cost-table .mute { color: #999; font-weight: 400; }

/* Total box */
.total-box { margin-top: 6mm; padding: 10px 14px; background: #f4f7fb; border-radius: 8px; }
.total-box .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 10pt; }
.total-box .grand { font-size: 12pt; font-weight: 700; color: #1e3a5f; }
.total-box .nds { font-size: 9pt; color: #6b7b8e; }

/* Footer */
.footer { position: absolute; bottom: 12mm; left: 20mm; right: 20mm; display: flex; justify-content: space-between; font-size: 8pt; color: #6b7b8e; border-top: 1px solid #dbe4ee; padding-top: 4px; }

/* Timeline */
.tl { display: flex; flex-direction: column; gap: 0; margin: 4mm 0; }
.tl-row { display: flex; gap: 12px; align-items: flex-start; }
.tl-dot { width: 10px; height: 10px; background: #1e3a5f; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
.tl-line { width: 2px; background: #dbe4ee; margin-left: 4px; flex: 1; }
.tl-content h4 { font-size: 10pt; font-weight: 700; color: #1e3a5f; }
.tl-content p { font-size: 9pt; color: #555; }
.tl-end { font-size: 9pt; color: #6b7b8e; margin-left: 22px; }

/* Compact */
.compact p { font-size: 9.5pt; color: #444; margin-bottom: 6px; }
.compact ul { margin: 4px 0; padding-left: 18px; }
.compact li { font-size: 9pt; color: #555; margin-bottom: 2px; }
</style>
{% endraw %}
